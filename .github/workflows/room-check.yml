name: Check ROOM
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  archive:
    env:
      ROOM_MEDIA_ORIGIN: ${{ vars.ROOM_MEDIA_ORIGIN }}
      ROOM_MX029_AUDIO_URL: ${{ vars.ROOM_MX029_AUDIO_URL }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:dependencies
      - run: npm run lint
      - run: npm run typecheck:underlevel
      - run: npm test
      - run: npm run build
      - name: Verify the built archive through HTTP
        run: |
          node scripts/serve.mjs &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          curl --silent --show-error --fail --retry 5 --retry-connrefused http://127.0.0.1:4173/ --output /dev/null
          node scripts/check-routes.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
